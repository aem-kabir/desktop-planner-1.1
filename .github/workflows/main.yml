name: Build Windows EXE and Installer

# Собирает DesktopPlanner.exe и DesktopPlanner_Setup.exe на настоящем
# Windows-раннере GitHub Actions при пуше в main/master, при пуше тега,
# или вручную через кнопку "Run workflow".
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-build.txt

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --noconfirm --clean
          --name "DesktopPlanner"
          --windowed
          --icon "app/assets/icon.ico"
          --add-data "app/assets;assets"
          --paths "app"
          "app/main.py"

      - name: Upload standalone EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPlanner-exe
          path: dist/DesktopPlanner/
          if-no-files-found: error

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\installer.iss"
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPlanner-Setup
          path: dist_installer/DesktopPlanner_Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/DesktopPlanner_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
